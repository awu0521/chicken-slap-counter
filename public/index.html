<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Chicken Slap Counter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="count" aria-live="polite">0</div>
  <div id="hint" class="hidden">drag a box around the chicken</div>

  <div id="stopwatch" title="drag to move">
    <span class="grip" aria-hidden="true">⋮⋮</span>
    <span id="sw-time">00:00.0</span>
    <button id="sw-toggle">start</button>
    <button id="sw-reset" aria-label="Reset stopwatch">reset</button>
  </div>

  <button id="menu-toggle" aria-expanded="false" aria-controls="drawer">settings</button>

  <aside id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>settings</h2>
      <button id="menu-close">close</button>
    </div>
    <p id="status"></p>

    <div class="row">
      <button id="reset">reset count</button>
      <button id="clear-zone">redraw box</button>
      <button id="switch-camera" class="hidden">switch camera</button>
    </div>

    <label>
      <span>slap speed threshold: <span id="speed-val"></span></span>
      <input id="speed" type="range" min="0.5" max="6" step="0.1" value="1.5" />
    </label>
    <div class="meter"><div id="speed-meter"></div><div id="speed-mark"></div></div>

    <label class="check">
      <input id="use-audio" type="checkbox" /> require slap sound (uses mic)
    </label>
    <label>
      <span>sound sensitivity: <span id="audio-val"></span></span>
      <input id="audio" type="range" min="1.5" max="10" step="0.5" value="4" />
    </label>
    <div class="meter"><div id="audio-meter"></div><div id="audio-mark"></div></div>
  </aside>

  <div id="start-screen">
    <div class="card">
      <h1>chicken slap counter</h1>
      <ol>
        <li>set the camera off to the side of the chicken</li>
        <li>drag a box around the chicken</li>
        <li>slap it</li>
      </ol>
      <button id="start">start camera</button>
      <p id="start-status"></p>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
